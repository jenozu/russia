services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-azbuka}
      POSTGRES_USER: ${POSTGRES_USER:-azbuka_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - azbuka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - azbuka_internal

  migrate:
    image: postgres:16-alpine
    restart: "no"
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-azbuka}
      PGUSER: ${POSTGRES_USER:-azbuka_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db:/db:ro
    command: ["sh", "/db/apply_migrations.sh"]
    networks:
      - azbuka_internal

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ORIGINS: ${APP_ORIGINS:?Set APP_ORIGINS in .env}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      MAX_SYNC_EVENTS: ${MAX_SYNC_EVENTS:-250}
      TOKEN_PEPPER: ${TOKEN_PEPPER:?Set TOKEN_PEPPER in .env}
      DAILY_XP_CAP: ${DAILY_XP_CAP:-1500}
      RATE_AUTH_PER_MIN: ${RATE_AUTH_PER_MIN:-10}
      RATE_LOGIN_FAILS_PER_15MIN: ${RATE_LOGIN_FAILS_PER_15MIN:-8}
      RATE_SYNC_PER_MIN: ${RATE_SYNC_PER_MIN:-120}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Keep the API private to the VPS. The reverse proxy reaches it on 127.0.0.1:8091 (host port 8090 belongs to another site on the VPS).
      - "127.0.0.1:${API_PORT:-8091}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      # Public routing is done by the VPS's Traefik (docker provider). Nothing else on the server is changed.
      traefik.enable: "true"
      traefik.docker.network: azbuka_edge
      traefik.http.services.azbuka-api.loadbalancer.server.port: "8090"
      traefik.http.middlewares.azbuka-strip.stripprefix.prefixes: /api
      traefik.http.middlewares.azbuka-body.buffering.maxrequestbodybytes: "65536"
      traefik.http.middlewares.azbuka-authrate.ratelimit.average: "10"
      traefik.http.middlewares.azbuka-authrate.ratelimit.period: 1m
      traefik.http.middlewares.azbuka-authrate.ratelimit.burst: "5"
      traefik.http.routers.azbuka-api.rule: "Host(`${AZBUKA_HOST:-azbuka.andel-vps.space}`) && PathPrefix(`/api/`)"
      traefik.http.routers.azbuka-api.entrypoints: websecure
      traefik.http.routers.azbuka-api.tls.certresolver: letsencrypt
      traefik.http.routers.azbuka-api.priority: "100"
      traefik.http.routers.azbuka-api.middlewares: azbuka-strip,azbuka-body
      traefik.http.routers.azbuka-auth.rule: "Host(`${AZBUKA_HOST:-azbuka.andel-vps.space}`) && PathPrefix(`/api/v1/auth/`)"
      traefik.http.routers.azbuka-auth.entrypoints: websecure
      traefik.http.routers.azbuka-auth.tls.certresolver: letsencrypt
      traefik.http.routers.azbuka-auth.priority: "200"
      traefik.http.routers.azbuka-auth.middlewares: azbuka-strip,azbuka-body,azbuka-authrate
      traefik.http.routers.azbuka-auth.service: azbuka-api
    networks:
      - azbuka_internal
      - azbuka_edge

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/web/headers.inc:/etc/nginx/conf.d/headers.inc:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      traefik.enable: "true"
      traefik.docker.network: azbuka_edge
      traefik.http.services.azbuka-web.loadbalancer.server.port: "80"
      traefik.http.routers.azbuka-web.rule: "Host(`${AZBUKA_HOST:-azbuka.andel-vps.space}`)"
      traefik.http.routers.azbuka-web.entrypoints: websecure
      traefik.http.routers.azbuka-web.tls.certresolver: letsencrypt
      traefik.http.routers.azbuka-web.priority: "1"
    networks:
      - azbuka_edge

volumes:
  azbuka_postgres_data:
    name: azbuka_postgres_data

networks:
  # db and migrate live only here: no route to or from the outside world.
  azbuka_internal:
    name: azbuka_internal
    driver: bridge
    internal: true
  # Only the api joins this network. Docker cannot publish a host port for a
  # container that is attached solely to an internal network, so the api needs it.
  azbuka_edge:
    name: azbuka_edge
    driver: bridge
