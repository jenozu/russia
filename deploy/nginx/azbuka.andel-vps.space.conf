# Azbuka: https://azbuka.andel-vps.space  (static app from dist/, API under /api/ -> 127.0.0.1:8090)
# Install: copy to /etc/nginx/sites-available/ (or conf.d/), enable, `nginx -t`, reload. Certificate via certbot (task 15).
# Never edit other sites' files on this server.

limit_req_zone $binary_remote_addr zone=azbuka_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=azbuka_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name azbuka.andel-vps.space;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name azbuka.andel-vps.space;

    ssl_certificate     /etc/letsencrypt/live/azbuka.andel-vps.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azbuka.andel-vps.space/privkey.pem;

    root /opt/azbuka/dist;
    index index.html;
    client_max_body_size 64k;

    include /opt/azbuka/deploy/nginx/azbuka-headers.inc;

    # Headers set inside a location replace the server-level ones, so these re-include the shared set.
    location = /service-worker.js { add_header Cache-Control "no-cache"; include /opt/azbuka/deploy/nginx/azbuka-headers.inc; try_files $uri =404; }
    location = /index.html        { add_header Cache-Control "no-cache"; include /opt/azbuka/deploy/nginx/azbuka-headers.inc; try_files $uri =404; }

    location /api/v1/auth/ {
        limit_req zone=azbuka_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090/v1/auth/;
        include /opt/azbuka/deploy/nginx/azbuka-proxy.inc;
    }

    # Trailing slash on proxy_pass strips the /api prefix: /api/v1/me -> /v1/me
    location /api/ {
        limit_req zone=azbuka_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090/;
        include /opt/azbuka/deploy/nginx/azbuka-proxy.inc;
    }

    location / {
        try_files $uri /index.html;
    }
}
