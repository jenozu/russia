# Step 1 of the first HTTPS setup: only port 80, so nginx -t passes before a certificate exists.
# Get the certificate with:  certbot certonly --webroot -w /var/www/html -d azbuka.andel-vps.space
# Then replace this file with azbuka.andel-vps.space.conf (the full site) and reload.
server {
    listen 80;
    listen [::]:80;
    server_name azbuka.andel-vps.space;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
