# Static app server inside the "web" container. TLS and routing are done by the VPS's Traefik.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    include /etc/nginx/conf.d/headers.inc;

    location = /service-worker.js { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/headers.inc; try_files $uri =404; }
    location = /index.html        { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/headers.inc; try_files $uri =404; }
    # Anything that looks like a file (has an extension) is served only if it really exists in dist/; no SPA fallback for it.
    location ~* \.[a-z0-9]+$ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
